# Enable ZMK Studio for real-time keymap editing
CONFIG_ZMK_STUDIO=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Inactivity timeout before entering deep sleep (15 minutes = 900000 ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Increase Bluetooth transmit power for a more stable wireless connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
